<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>V-PCC Live Viewer</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0b0f14;
      color: #d7e2ef;
      font-family: "Segoe UI", system-ui, sans-serif;
    }
    #hud {
      position: fixed;
      top: 12px;
      left: 12px;
      z-index: 2;
      padding: 10px 12px;
      border-radius: 8px;
      background: rgba(8, 12, 18, 0.72);
      backdrop-filter: blur(8px);
      font-size: 13px;
      line-height: 1.5;
    }
    #hud label {
      display: block;
      margin-top: 8px;
    }
    #hud input,
    #hud textarea {
      width: 280px;
      margin-top: 4px;
      padding: 6px 8px;
      border-radius: 6px;
      border: 1px solid #314055;
      background: #111822;
      color: inherit;
      font-family: inherit;
      font-size: inherit;
      resize: vertical;
    }
    #serverList {
      margin-top: 8px;
      font-size: 12px;
      color: #9ab0c8;
      white-space: pre-line;
      max-height: 120px;
      overflow-y: auto;
    }
    #profileStats {
      margin-top: 8px;
      font-size: 11px;
      color: #7eb6ff;
      white-space: pre-line;
      font-family: Consolas, "Courier New", monospace;
    }
    #hud button {
      margin-top: 10px;
      padding: 8px 12px;
      border: 0;
      border-radius: 6px;
      background: #2f7cf6;
      color: white;
      cursor: pointer;
    }
    canvas {
      display: block;
    }
  </style>
</head>
<body onload="connect()">
  <div id="hud">
    <strong>V-PCC Live Viewer</strong>
    <div id="status">Idle</div>
    <label>
      WebSocket relay URLs (one per line)
      <textarea id="wsUrls" rows="4">ws://10.161.2.104:8081</textarea>
    </label>
    <button id="connectBtn">Connect All</button>
    <div id="serverList"></div>
    <div id="profileStats"></div>
    <div style="margin-top:8px"><a href="playback.html" style="color:#7eb6ff">Open .v3c file playback</a></div>
  </div>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
      }
    }
  </script>
  <script type="module" src="./js/main.js"></script>
</body>
</html>
